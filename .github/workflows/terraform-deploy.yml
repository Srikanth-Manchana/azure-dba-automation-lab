name: Terraform Deploy

on:
  push:
    branches: [main]
    paths:
      - 'track-**/**/*.tf'
      - 'track-**/**/*.hcl'
      - '.github/workflows/terraform-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'track-**/**/*.tf'
      - 'track-**/**/*.hcl'

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Detect which modules changed
  # Runs first — outputs a list of changed module paths
  # All other jobs depend on this output
  # ─────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find-modules.outputs.modules }}
      has_changes: ${{ steps.find-modules.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # fetch-depth: 0 fetches full git history
          # needed so we can compare this commit against main
          # without it we only get the latest commit with no history to diff against

      - name: Find changed Terraform modules
        id: find-modules
        run: |
          # Get list of changed .tf files compared to main branch
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1...HEAD)
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Extract unique module directories from changed .tf files
          # Example: track-b-git-cicd/07-state-backend-bootstrap/main.tf
          # Becomes: track-b-git-cicd/07-state-backend-bootstrap
          MODULES=$(echo "$CHANGED_FILES" \
            | grep '\.tf$\|\.hcl$' \
            | grep '^track-' \
            | xargs -I{} dirname {} \
            | sort -u \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "Changed modules: $MODULES"

          if [ "$MODULES" == "[]" ] || [ -z "$MODULES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "modules=[]" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "modules=$MODULES" >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────────────────────
  # Job 2: Validate — runs once per changed module
  # ─────────────────────────────────────────────────────────────
  validate:
    name: Validate (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.modules) }}
      fail-fast: false
      # fail-fast: false means if Module 01 validate fails
      # Module 07 validate still runs — you see ALL failures at once
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ${{ matrix.module }}
        # matrix.module = the specific changed module path
        # e.g. track-b-git-cicd/07-state-backend-bootstrap

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: ${{ matrix.module }}
        # -backend=false skips backend connection for validate
        # validate does not need real state

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ matrix.module }}

  # ─────────────────────────────────────────────────────────────
  # Job 3: Plan — runs once per changed module on PRs only
  # ─────────────────────────────────────────────────────────────
  plan:
    name: Plan (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: [detect-changes, validate]
    if: |
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.modules) }}
      fail-fast: false
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: |
          terraform init -backend=false
        working-directory: ${{ matrix.module }}
        # Using -backend=false for plan in PR
        # Full backend config will be added per module in a later step
        # when we wire up backend.tf files

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color 2>&1 | tee plan-output.txt
          exit ${PIPESTATUS[0]}
        working-directory: ${{ matrix.module }}
        continue-on-error: true

      - name: Comment Plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync(
              '${{ matrix.module }}/plan-output.txt', 'utf8'
            );
            const module = '${{ matrix.module }}';
            const status = '${{ steps.plan.outcome }}' === 'success' ? '✅' : '❌';

            const comment = `### ${status} Terraform Plan — \`${module}\`

            <details>
            <summary>Click to expand plan output</summary>

            \`\`\`terraform
            ${planOutput.substring(0, 60000)}
            \`\`\`
            </details>

            *Module: \`${module}\` | Actor: @${{ github.actor }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # ─────────────────────────────────────────────────────────────
  # Job 4: Apply — runs on push to main only
  # Still hardcoded to Module 01 for now
  # Will be updated when we wire up all backend.tf files
  # ─────────────────────────────────────────────────────────────
  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: [detect-changes, validate]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.detect-changes.outputs.has_changes == 'true'
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=rg-adal-tfstate" \
            -backend-config="storage_account_name=${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=module-01.terraform.tfstate"
        working-directory: track-a-foundations/01-terraform-fundamentals

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: track-a-foundations/01-terraform-fundamentals
