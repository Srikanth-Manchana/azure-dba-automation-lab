name: Terraform Deploy

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
permissions:
    id-token: write
    contents: read
    pull-requests: write

jobs:
    # ── Job 1: Detect which modules changed ───────────────────────────────────
    detect-changes:
        name: Detect Changed Modules
        runs-on: ubuntu-latest
        outputs:
            modules: ${{ steps.find-modules.outputs.modules }}
            has_changes: ${{ steps.find-modules.outputs.has_changes }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Find changed Terraform modules
              id: find-modules
              run: |
                  if [ "${{ github.event_name }}" == "pull_request" ]; then
                    CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
                  else
                    CHANGED_FILES=$(git diff --name-only HEAD~1...HEAD)
                  fi

                  echo "Changed files:"
                  echo "$CHANGED_FILES"

                  MODULES=$(echo "$CHANGED_FILES" \
                    | grep -E '\.tf$|\.hcl$' \
                    | grep '^track-' \
                    | xargs -I{} dirname {} \
                    | sort -u \
                    | jq -R -s -c 'split("\n") | map(select(length > 0))')

                  echo "Changed modules: $MODULES"

                  if [ "$MODULES" == "[]" ] || [ -z "$MODULES" ]; then
                    echo "has_changes=false" >> $GITHUB_OUTPUT
                    echo "modules=[]" >> $GITHUB_OUTPUT
                  else
                    echo "has_changes=true" >> $GITHUB_OUTPUT
                    echo "modules=$MODULES" >> $GITHUB_OUTPUT
                  fi

    # ── Job 2: Validate — runs per changed module ─────────────────────────────
    validate:
        name: Validate (${{ matrix.module }})
        runs-on: ubuntu-latest
        needs: detect-changes
        if: needs.detect-changes.outputs.has_changes == 'true'
        strategy:
            matrix:
                module: ${{ fromJson(needs.detect-changes.outputs.modules) }}
            fail-fast: false
        steps:
            - uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: "~> 1.9"

            - name: Verify backend.tf exists
              run: |
                MODULE="${{ matrix.module }}"
                if [ ! -f "$MODULE/backend.tf" ]; then
                  echo "ERROR: $MODULE/backend.tf is missing"
                  echo "Every module must have a backend.tf pointing to the remote state backend"
                  exit 1
                fi
                if ! grep -q "stadalstateadcy0lo2" "$MODULE/backend.tf"; then
                  echo "ERROR: backend.tf does not reference the correct storage account"
                  exit 1
                fi
                if ! grep -q "rg-adal-tfstate" "$MODULE/backend.tf"; then
                  echo "ERROR: backend.tf does not reference the correct resource group"
                  exit 1
                fi
                echo "backend.tf verified for $MODULE"
                echo "State key: $(grep key $MODULE/backend.tf | tr -d ' ')"

            - name: Terraform Format Check
              run: terraform fmt -check -recursive
              working-directory: ${{ matrix.module }}

            - name: Terraform Init
              run: terraform init -backend=false
              working-directory: ${{ matrix.module }}

            - name: Terraform Validate
              run: terraform validate
              working-directory: ${{ matrix.module }}

    # ── Job 3: Plan — runs per changed module on PRs only ─────────────────────
    plan:
        name: Plan (${{ matrix.module }})
        runs-on: ubuntu-latest
        needs: [detect-changes, validate]
        if: |
            github.event_name == 'pull_request' &&
            needs.detect-changes.outputs.has_changes == 'true'
        strategy:
            matrix:
                module: ${{ fromJson(needs.detect-changes.outputs.modules) }}
            fail-fast: false
        permissions:
            id-token: write
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: "~> 1.9"

            - name: Authenticate to Azure
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Terraform Init
              run: |
                  terraform init \
                    -backend-config="resource_group_name=rg-adal-tfstate" \
                    -backend-config="storage_account_name=${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}" \
                    -backend-config="container_name=tfstate" \
                    -backend-config="key=$(basename ${{ matrix.module }}).terraform.tfstate" \
                    -backend-config="use_oidc=true" \
                    -backend-config="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
                    -backend-config="client_id=${{ secrets.AZURE_CLIENT_ID }}" \
                    -backend-config="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}"
              working-directory: ${{ matrix.module }}

            - name: Terraform Plan
              id: plan
              run: terraform plan -no-color 2>&1 | tee plan-output.txt
              working-directory: ${{ matrix.module }}
              continue-on-error: true

            - name: Comment Plan on PR
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const planOutput = fs.readFileSync(
                        '${{ matrix.module }}/plan-output.txt', 'utf8'
                      );
                      const module = '${{ matrix.module }}';
                      const status = '${{ steps.plan.outcome }}' === 'success' ? '✅' : '❌';
                      const comment = [
                        `### ${status} Terraform Plan — \`${module}\``,
                        '',
                        '<details>',
                        '<summary>Click to expand plan output</summary>',
                        '',
                        '```terraform',
                        planOutput.substring(0, 60000),
                        '```',
                        '',
                        '</details>',
                        '',
                        `*Module: \`${module}\` | Actor: @${{ github.actor }}*`
                      ].join('\n');

                      github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: comment
                      });
                  github-token: ${{ secrets.GITHUB_TOKEN }}

    # ── Job 4: Apply — runs per changed module on push to main ────────────────
    apply:
        name: Apply (${{ matrix.module }})
        runs-on: ubuntu-latest
        needs: [detect-changes, validate]
        if: |
            github.ref == 'refs/heads/main' &&
            github.event_name == 'push' &&
            needs.detect-changes.outputs.has_changes == 'true'
        strategy:
            matrix:
                module: ${{ fromJson(needs.detect-changes.outputs.modules) }}
            fail-fast: false
        environment: production
        permissions:
            id-token: write
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: "~> 1.9"

            - name: Authenticate to Azure
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Terraform Init
              run: |
                  terraform init \
                    -backend-config="resource_group_name=rg-adal-tfstate" \
                    -backend-config="storage_account_name=${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}" \
                    -backend-config="container_name=tfstate" \
                    -backend-config="key=$(basename ${{ matrix.module }}).terraform.tfstate" \
                    -backend-config="use_oidc=true" \
                    -backend-config="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
                    -backend-config="client_id=${{ secrets.AZURE_CLIENT_ID }}" \
                    -backend-config="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}"
              working-directory: ${{ matrix.module }}

            - name: Terraform Apply
              id: apply
              run: |
                  terraform apply -auto-approve -no-color 2>&1 | tee apply-output.txt
                  exit ${PIPESTATUS[0]}
              working-directory: ${{ matrix.module }}

            - name: Terraform Output
              id: tf-output
              if: always()
              run: terraform output -no-color 2>&1 | tee output-values.txt
              working-directory: ${{ matrix.module }}

            - name: Post Apply Summary
              if: always()
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const module = '${{ matrix.module }}';

                      let applyOutput = '';
                      try {
                        applyOutput = fs.readFileSync(`${module}/apply-output.txt`, 'utf8');
                      } catch (e) {
                        applyOutput = 'Could not read apply output';
                      }

                      let tfOutputs = '';
                      try {
                        tfOutputs = fs.readFileSync(`${module}/output-values.txt`, 'utf8');
                      } catch (e) {
                        tfOutputs = 'No outputs available';
                      }

                      const summaryMatch = applyOutput.match(/Apply complete!.*$/m) ||
                                           applyOutput.match(/No changes\..*$/m) ||
                                           applyOutput.match(/Error:.*$/m);
                      const summary = summaryMatch ? summaryMatch[0] : 'Apply completed';
                      const applyStatus = '${{ steps.apply.outcome }}' === 'success' ? '✅' : '❌';

                      const comment = [
                        `### ${applyStatus} Terraform Apply — \`${module}\``,
                        '',
                        `**Result:** ${summary}`,
                        `**Triggered by:** @${{ github.actor }}`,
                        `**Commit:** \`${{ github.sha }}\``,
                        `**Branch:** \`${{ github.ref_name }}\``,
                        '',
                        '---',
                        '',
                        '<details>',
                        '<summary>📋 Terraform Outputs (current state)</summary>',
                        '',
                        '```',
                        tfOutputs,
                        '```',
                        '',
                        '</details>',
                        '',
                        '<details>',
                        '<summary>📜 Full Apply Log</summary>',
                        '',
                        '```',
                        applyOutput.substring(0, 50000),
                        '```',
                        '',
                        '</details>'
                      ].join('\n');

                      await github.rest.repos.createCommitComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        commit_sha: context.sha,
                        body: comment
                      });
                  github-token: ${{ secrets.GITHUB_TOKEN }}
