name: Terraform Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false
        working-directory: track-a-foundations/01-terraform-fundamentals

      - name: terraform Validate
        run: terraform validate
        working-directory: track-a-foundations/01-terraform-fundamentals

  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=rg-adal-tfstate" \
            -backend-config="storage_account_name=${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=module-01.terraform.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -backend-config="client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -backend-config="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}"
        working-directory: track-a-foundations/01-terraform-fundamentals

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        working-directory: track-a-foundations/01-terraform-fundamentals

      - name: Comment Plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const plan = process.env.PLAN;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '#### Terraform Plan\n```\n' + plan + '\n```'
            });
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}

  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=rg-adal-tfstate" \
            -backend-config="storage_account_name=${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=module-01.terraform.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -backend-config="client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -backend-config="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}"
        working-directory: track-a-foundations/01-terraform-fundamentals

      - name: Terraform Apply
        id: apply
        run: |
          terraform apply -auto-approve -no-color 2>&1 | tee apply-output.txt
          exit ${PIPESTATUS[0]}
        working-directory: track-a-foundations/01-terraform-fundamentals
        # tee writes output to both the terminal AND apply-output.txt
        # PIPESTATUS[0] captures terraform's exit code (not tee's)
        # so the step still fails correctly if apply fails

      - name: Terraform Output
        id: tf-output
        if: always()
        run: |
          terraform output -no-color 2>&1 | tee output-values.txt
        working-directory: track-a-foundations/01-terraform-fundamentals
        # if: always() — runs even if apply failed
        # so we always see the current state of outputs
        # useful for diagnosing partial failures

      - name: Post Apply Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Read apply output file
            let applyOutput = '';
            try {
              applyOutput = fs.readFileSync(
                'track-a-foundations/01-terraform-fundamentals/apply-output.txt',
                'utf8'
              );
            } catch (e) {
              applyOutput = 'Could not read apply output';
            }

            // Read terraform outputs file
            let tfOutputs = '';
            try {
              tfOutputs = fs.readFileSync(
                'track-a-foundations/01-terraform-fundamentals/output-values.txt',
                'utf8'
              );
            } catch (e) {
              tfOutputs = 'No outputs available';
            }

            // Extract summary line from apply output
            const summaryMatch = applyOutput.match(/Apply complete!.*$/m) ||
                                 applyOutput.match(/No changes\..*$/m) ||
                                 applyOutput.match(/Error:.*$/m);
            const summary = summaryMatch ? summaryMatch[0] : 'Apply completed';

            // Build the comment
            const applyStatus = '${{ steps.apply.outcome }}' === 'success' ? '✅' : '❌';
            const comment = [
              `### ${applyStatus} Terraform Apply — \`track-a-foundations/01-terraform-fundamentals\``,
              '',
              `**Result:** ${summary}`,
              `**Triggered by:** @${{ github.actor }}`,
              `**Commit:** \`${{ github.sha }}\``,
              `**Branch:** \`${{ github.ref_name }}\``,
              '',
              '---',
              '',
              '<details>',
              '<summary>📋 Terraform Outputs (current state)</summary>',
              '',
              '```',
              tfOutputs,
              '```',
              '',
              '</details>',
              '',
              '<details>',
              '<summary>📜 Full Apply Log</summary>',
              '',
              '```',
              applyOutput.substring(0, 50000),
              '```',
              '',
              '</details>'
            ].join('\n');

            // Post as commit comment (not PR comment — this runs on push to main)
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: comment
            });
          github-token: ${{ secrets.GITHUB_TOKEN }}
        # Posts as a commit comment rather than PR comment
        # because Apply runs on push to main (after PR is merged)
        # not during the PR itself
